engine = "nemotron"
state_file = "auto"

[nemotron]
model = "nemotron-speech-streaming-en-0.6b-Q8_0.gguf"
backend = "cuda"
streaming = true
streaming_chunk_ms = 160

[hotkey]
enabled = true
key = "EVTEST_47"
modifiers = ["LEFTMETA"]
mode = "push_to_talk"

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 30

[output]
mode = "type"
driver_order = ["eitype"]
fallback_to_clipboard = false
pre_type_delay_ms = 0
auto_submit = false
append_text = " "

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false

[osd]
enabled = false

[transcript_popup]
enabled = true
review_mode = false
font_size = 24.0
opacity = 0.8
width_px = 860
height_px = 380
final_display_ms = 1000
